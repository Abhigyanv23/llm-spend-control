# Phase 3: request complexity routing.
# The router is the mechanism; this file is the policy. Validated against models.yaml at startup.

tier_descriptions:
  1: Extraction and formatting
  2: Summarisation and classification
  3: Reasoning-heavy or high-risk work

# Candidate models per tier, in order of preference. The router picks the FIRST candidate whose
# provider is available (API key set), whose context window fits, and that supports what the
# feature requires. Choose a profile with ROUTING_PROFILE.
profiles:
  dev:
    tiers:
      1: [mock-echo]
      2: [mock-medium]
      3: [mock-large]
    baseline_model: mock-large        # "what if everything went to the strongest model?"

  production:
    tiers:
      1: [gpt-4o-mini, claude-haiku-4-5]   # add llama3.2 here if you run Ollama
      2: [claude-haiku-4-5]
      3: [claude-sonnet-5-5]
    baseline_model: claude-sonnet-5-5

# At a budget limit, try a cheaper allowed tier before blocking (per-feature opt-out below)
budget_downgrade: true

# Optional floor by priority, e.g. {critical: 3, high: 2}. Off by default: priority governs
# budget overrides, risk governs model quality.
priority_min_tier: {}

# Per-feature override rules: min_tier, max_tier, pin_model, requires, budget_downgrade, reason
features:
  contract-review:
    min_tier: 3
    budget_downgrade: false
    reason: "Legal review: correctness matters more than cost"
  code-review:
    min_tier: 2
    reason: "Code review needs at least a mid-tier model"
  autocomplete:
    max_tier: 1
    reason: "High-volume and latency-sensitive: always the cheapest tier"
  # compliance-audit:
  #   pin_model: claude-sonnet-5-5
  #   reason: "Audited workflow: always the same model for reproducibility"

classifier:
  # rules-v1: keywords anywhere in the instructions (Phase 3).
  # rules-v2: + ignores keywords in the payload after an instruction's colon, ignores negated
  #           keywords ("don't analyze"), treats open why/how/what-if questions as tier 3.
  #           Designed on the training split, evaluated on the held-out split (Phase 6).
  version: rules-v2
  long_context_tokens: 6000           # inputs larger than this need at least tier 2
  # Whole-word, case-insensitive; an optional trailing "s"/"es" is also matched.
  keywords:
    1: [extract, format, reformat, convert, parse, "fill in", uppercase, lowercase,
        capitalize, "fix typos", "fix spelling"]
    2: [summarize, summarise, summary, classify, categorize, categorise, sentiment, tag,
        label, rewrite, paraphrase, translate, "key points", outline]
    3: [analyze, analyse, analysis, reason, reasoning, prove, derive, debug, design,
        architect, architecture, plan, strategy, evaluate, critique, compare,
        "step by step", "trade-off", tradeoff, "root cause", "explain why"]
  risk_keywords: [legal, contract, lawsuit, liability, medical, diagnosis, dosage,
                  prescription, "financial advice", investment, tax, compliance, gdpr,
                  "security vulnerability", "production incident"]
  structured_output_keywords: [json, yaml, csv, xml, table]