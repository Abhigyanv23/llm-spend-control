name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:                       # a newer push cancels the older run of the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "ruff>=0.6"
      - run: python -m ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      # Unit + in-process API tests: fakeredis + SQLite, no services needed
      - run: python -m pytest -q

  smoke:
    # End-to-end against REAL Postgres 16 + Redis 7 (service containers), like the laptop setup
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spend
          POSTGRES_PASSWORD: spend_dev_password
          POSTGRES_DB: spend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spend -d spend"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://spend:spend_dev_password@127.0.0.1:5432/spend
      REDIS_URL: redis://127.0.0.1:6379/0
      GATEWAY_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python scripts/seed_budgets.py
      - run: python scripts/seed_demo_data.py --days 20
      - name: Start the gateway
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > gateway.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - run: python scripts/smoke_test.py
      - run: python scripts/smoke_routing.py
      - run: python scripts/smoke_quality.py
      - run: python scripts/smoke_dashboard.py
      - name: Gateway log (on failure)
        if: failure()
        run: cat gateway.log
